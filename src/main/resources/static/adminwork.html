<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TaskPort - Admin Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo"><h1>TaskPort - Admin</h1></div>
      <div><button class="btn ghost" onclick="adminLogout()">Logout</button></div>
    </div>

    <div style="margin-top:18px" class="card">
      <h3>Pending Projects</h3>
      <div id="pendingContainer"></div>
    </div>

    <div id="currentProjects" style="margin-top:18px;display:block" class="card">
      <h3>Current Projects (Accepted)</h3>
      <div id="currentContainer"></div>
    </div>

    
  </div>

<script>
async function loadPending(){
  const res=await fetch('/api/admin/pending'); if(!res.ok){document.getElementById('pendingContainer').innerText='Failed to load';return}
  const list=await res.json(); const container=document.getElementById('pendingContainer');container.innerHTML='';
  list.forEach(p=>{
    const div=document.createElement('div');div.className='project-card';
    const left=document.createElement('div');left.innerHTML=`<a href='/clientprojects.html?id=${p.id}'><strong>${p.title}</strong></a><div class='small'>${p.client_name||('Client ID: '+p.clientId)}</div><div class='small' style='margin-top:6px'>${p.description?p.description.substring(0,140):''}</div>`;
    const right=document.createElement('div');right.innerHTML=`<div style='display:flex;gap:8px;flex-direction:column;align-items:flex-end'><button class='btn' onclick='accept(${p.id})' style='background:var(--success)'>Accept</button><button class='btn ghost' onclick='reject(${p.id})' style='border-color:var(--danger);color:var(--danger)'>Reject</button><button class='btn ghost' onclick='openMessage(${p.id})'>Message</button></div>`;
    div.appendChild(left);div.appendChild(right);container.appendChild(div);
  });
  // also refresh accepted/current projects
  loadAccepted();
}
async function accept(id){const res=await fetch(`/api/admin/${id}/accept`,{method:'POST'});if(res.ok){alert('Accepted');loadPending()} }
async function reject(id){const res=await fetch(`/api/admin/${id}/reject`,{method:'POST'});if(res.ok){alert('Rejected');loadPending()} }
function openMessage(id){const text=prompt('Message to client');if(!text) return;fetch(`/api/admin/${id}/message`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})}).then(r=>{if(r.ok)alert('Message sent')})}

async function adminLogout(){await fetch('/api/logout',{method:'POST'}).catch(()=>{});location.href='/';}

async function loadAccepted(){
  const res = await fetch('/api/admin/accepted');
  const container = document.getElementById('currentContainer');
  if(!res.ok){container.innerText='Failed to load';return}
  const list = await res.json(); container.innerHTML='';
  list.forEach(p=>{
    const div=document.createElement('div');div.className='project-card';
    const left=document.createElement('div');left.style.flex='1';left.innerHTML=`<strong>${p.title}</strong><div class='small' style='margin-top:6px'>${p.description?p.description.substring(0,120):''}</div><div class='small' style='margin-top:6px'>Client: ${p.client_name||p.clientId}</div>`;
    const right=document.createElement('div');right.innerHTML=`<div style='display:flex;flex-direction:column;gap:8px;align-items:flex-end'><button class='btn' onclick='completeProject(${p.id})' style='background:var(--primary)'>Completed</button><button class='btn ghost' onclick='openMessage(${p.id})'>Message</button></div>`;
    div.appendChild(left);div.appendChild(right);container.appendChild(div);
  });
}

async function completeProject(id){
  if(!confirm('Mark project as completed?')) return;
  const res = await fetch(`/api/admin/${id}/complete`,{method:'POST'});
  if(!res.ok){alert('Failed to mark completed');return}
  // refresh lists
  loadPending();
  loadAccepted();
}

loadPending();
</script>
</body>
</html>
